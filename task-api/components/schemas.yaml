      items:
        $ref: "#/AuthorResponse"
    pagination:
      $ref: "#/PaginationMeta"

BorrowRecord:
  type: object
  required:
    - id
    - book_id
    - user_id
    - borrow_date
    - due_date
    - status
  properties:
    id:
      type: string
      format: uuid
      description: Mã định danh duy nhất của phiếu mượn
      example: "c2a7bc77-7e0a-2ef6-994b-4bb7bd160e33"
    book_id:
      type: string
      format: uuid
      description: ID cuốn sách được mượn
      example: "a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11"
    user_id:
      type: string
      format: uuid
      description: ID người mượn sách
      example: "d3b6bc66-6f0a-1ef5-883a-3aa6bd050d44"
    borrow_date:
      type: string
      format: date
      description: Ngày bắt đầu mượn sách
      example: "2026-10-01"
    due_date:
      type: string
      format: date
      description: Hạn chót phải trả sách
      example: "2026-10-15"
    return_date:
      type: string
      format: date
      nullable: true
      description: Ngày thực tế trả sách (null nếu chưa trả)
      example: null
    status:
      type: string
      enum: [pending, borrowed, returned, overdue]
      description: Trạng thái phiếu mượn (đang chờ duyệt, đang mượn, đã trả, quá hạn)
      example: "borrowed"
    renew_count:
      type: integer
      minimum: 0
      description: Số lần đã gia hạn mượn
      example: 0
    note:
      type: string
      description: Ghi chú tình trạng sách hoặc thông tin mượn
      example: "Sách mới, bìa nguyên vẹn"
    fine_amount:
      type: number
      format: float
      minimum: 0
      description: Tiền phạt nếu trả muộn hoặc làm hư hại sách (VNĐ)
      example: 0.0
    created_at:
      type: string
      format: date-time
      description: Thời điểm tạo bản ghi
      example: "2026-10-01T08:30:00Z"
    updated_at:
      type: string
      format: date-time
      description: Thời điểm cập nhật lần cuối
      example: "2026-10-01T08:30:00Z"

BorrowCreateRequest:
  type: object
  required:
    - book_id
    - user_id
  properties:
    book_id:
      type: string
      format: uuid
      description: ID của cuốn sách muốn mượn
      example: "a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11"
    user_id:
      type: string
      format: uuid
      description: ID của người mượn sách
      example: "d3b6bc66-6f0a-1ef5-883a-3aa6bd050d44"
    due_date:
      type: string
      format: date
      description: Ngày dự kiến trả (nếu không điền sẽ mặc định theo quy định thư viện, ví dụ +14 ngày)
      example: "2026-10-25"
    note:
      type: string
      description: Ghi chú ban đầu
      example: "Mượn phục vụ nghiên cứu luận văn"

BorrowUpdateRequest:
  type: object
  properties:
    status:
      type: string
      enum: [borrowed, returned, overdue]
      description: Cập nhật trạng thái phiếu mượn
      example: "returned"
    return_date:
      type: string
      format: date
      description: Ngày thực tế trả sách (bắt buộc khi status = returned)
      example: "2026-10-14"
    due_date:
      type: string
      format: date
      description: Gia hạn ngày hẹn trả
      example: "2026-10-30"
    note:
      type: string
      description: Ghi chú khi trả hoặc gia hạn (tình trạng sách lúc trả)
      example: "Đã trả đủ sách, gáy sách hơi sờn"
    fine_amount:
      type: number
      format: float
      minimum: 0
      description: Tiền phạt thu thêm (nếu có)
      example: 10000.0

BorrowListResponse:
  type: object
  required:
    - data
    - pagination
  properties:
    data:
      type: array
      items:
        $ref: "#/BorrowRecord"
    pagination:
      $ref: "#/PaginationMeta"

LoginRequest:
  type: object
  required:
    - username
    - password
  properties:
    username:
      type: string
      example: "admin"
    password:
      type: string
      format: password
      example: "password123"

LoginResponse:
  type: object
  properties:
    access_token:
      type: string
      description: Chuỗi JWT token để xác thực các request sau
      example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM..."
    token_type:
      type: string
      example: "Bearer"
    expires_in:
      type: integer
      description: Thời gian sống của token (tính bằng giây)
      example: 3600

RegisterRequest:
  type: object
  required:
    - username
    - password
    - email
    - full_name
  properties:
    username:
      type: string
      example: "nguyenvanmuoi"
    password:
      type: string
      format: password
      example: "tenbanlagi"
    email:
      type: string
      format: email
      example: "[EMAIL_ADDRESS]"
    full_name:
      type: string
      example: "Nguyễn Văn Mười"

User:
  type: object
  properties:
    id:
      type: string
      format: uuid
      example: "e6f4a8b2-1b1c-4b1a-9f5b-1c5b8b9b8b9b"
    username:
      type: string
      example: "nguyenvanmuoi"
    email:
      type: string
      format: email
      example: "[EMAIL_ADDRESS]"
    full_name:
      type: string
      example: "Nguyễn Văn Mười"
    role:
      type: string
      enum: [admin, user, librarian]
      example: "user"
