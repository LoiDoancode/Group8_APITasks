ErrorDetail:
  type: object
  description: Chi tiết lỗi phát sinh theo từng trường dữ liệu
  required:
    - field
    - issue
  properties:
    field:
      type: string
      description: Tên trường bị lỗi
      example: "published_year"
    issue:
      type: string
      description: Chi tiết lỗi phát sinh
      example: "Năm xuất bản không được lớn hơn năm hiện tại"

ErrorResponse:
  type: object
  description: Cấu trúc phản hồi lỗi chuẩn
  required:
    - code
    - message
    - timestamp
  properties:
    code:
      type: integer
      description: Mã trạng thái HTTP hoặc Mã lỗi nội bộ
      example: 400
    message:
      type: string
      description: Thông điệp giải thích lỗi
      example: "Dữ liệu yêu cầu không hợp lệ"
    timestamp:
      type: string
      format: date-time
      description: Thời điểm phát sinh lỗi
      example: "2026-10-08T19:40:00Z"
    details:
      type: array
      description: Danh sách chi tiết lỗi theo từng trường dữ liệu (nếu có)
      items:
        $ref: "#/ErrorDetail"

PaginationMeta:
  type: object
  required:
    - page
    - limit
    - total_items
    - total_pages
  properties:
    page:
      type: integer
      minimum: 1
      description: Trang hiện tại
      example: 1
    limit:
      type: integer
      minimum: 1
      maximum: 100
      description: Số phần tử tối đa trên mỗi trang
      example: 10
    total_items:
      type: integer
      minimum: 0
      description: Tổng số phần tử trong tập dữ liệu
      example: 150
    total_pages:
      type: integer
      minimum: 0
      description: Tổng số trang (total_items / limit)
      example: 15

# ==========================================
# 2. ENTITY SCHEMAS BASE (Khung nền cho TV2, TV3, TV4)
# ==========================================

# ---- TV2: Book Schema hoàn chỉnh ----
Book:
  type: object
  description: >
    Thực thể đại diện cho một cuốn sách trong hệ thống thư viện.
    Chứa đầy đủ thông tin mô tả, phân loại, số lượng và trạng thái sẵn có.
  required:
    - id
    - title
    - author_id
    - category_id
    - category
    - quantity
  properties:
    id:
      type: string
      format: uuid
      description: Mã định danh duy nhất của cuốn sách (UUID v4)
      example: "a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11"
    title:
      type: string
      maxLength: 255
      description: Tiêu đề cuốn sách
      example: "Thiết Kế Kiến Trúc Microservices"
    description:
      type: string
      maxLength: 2000
      description: Mô tả ngắn gọn nội dung cuốn sách
      example: "Cuốn sách hướng dẫn toàn diện về thiết kế và triển khai kiến trúc Microservices trong các hệ thống phân tán hiện đại."
    isbn:
      type: string
      pattern: '^\d{3}-\d{1,5}-\d{1,7}-\d{1,7}-\d{1}$'
      description: Mã ISBN (International Standard Book Number) theo chuẩn ISBN-13
      example: "978-3-16-148410-0"
    author_id:
      type: string
      format: uuid
      description: Mã định danh của tác giả (liên kết đến Author)
      example: "b1f8bc88-8d0a-3ef7-aa5c-5aa8bd270f22"
    category_id:
      type: string
      format: uuid
      description: Mã định danh của danh mục/thể loại sách (dùng để lọc)
      example: "f4c7bc55-5d0a-0ef4-772a-2ff5bd940c11"
    category:
      type: string
      description: Tên danh mục/thể loại sách (hiển thị)
      example: "Công nghệ thông tin"
    published_year:
      type: integer
      minimum: 1000
      maximum: 2100
      description: Năm xuất bản
      example: 2025
    quantity:
      type: integer
      minimum: 0
      description: Tổng số lượng sách trong thư viện
      example: 20
    available_quantity:
      type: integer
      minimum: 0
      description: Số lượng sách hiện có sẵn để mượn
      example: 15
    created_at:
      type: string
      format: date-time
      description: Thời điểm bản ghi được tạo
      example: "2026-01-15T08:30:00Z"
    updated_at:
      type: string
      format: date-time
      description: Thời điểm bản ghi được cập nhật lần cuối
      example: "2026-06-20T14:00:00Z"

# ---- TV2: Response Schemas cho Books API ----
BookListResponse:
  type: object
  description: Phản hồi danh sách sách kèm thông tin phân trang
  required:
    - data
    - pagination
  properties:
    data:
      type: array
      description: Danh sách các cuốn sách phù hợp với điều kiện truy vấn
      items:
        $ref: "#/Book"
    pagination:
      $ref: "#/PaginationMeta"

BookDetailResponse:
  type: object
  description: Phản hồi chi tiết một cuốn sách
  required:
    - data
  properties:
    data:
      $ref: "#/Book"

# Base Author Schema
Author:
  type: object
  required:
    - id
    - name
  properties:
    id:
      type: string
      format: uuid
      example: "b1f8bc88-8d0a-3ef7-aa5c-5aa8bd270f22"
    name:
      type: string
      maxLength: 100
      example: "Nguyen Van A"
    email:
      type: string
      format: email
      example: "nguyenvana@example.com"
    bio:
      type: string
      example: "Chuyên gia với 10 năm kinh nghiệm thiết kế hệ thống phân tán."
    created_at:
      type: string
      format: date-time
      example: "2025-11-20T10:00:00Z"

# 4. BORROW SCHEMAS

# Entity đầy đủ của phiếu mượn
BorrowRecord:
  type: object
  required:
    - id
    - book_id
    - user_id
    - borrow_date
    - due_date
    - status
  properties:
    id:
      type: string
      format: uuid
      description: Mã định danh duy nhất của phiếu mượn
      example: "c2a7bc77-7e0a-2ef6-994b-4bb7bd160e33"
    book_id:
      type: string
      format: uuid
      description: ID cuốn sách được mượn
      example: "a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11"
    user_id:
      type: string
      format: uuid
      description: ID người mượn sách
      example: "d3b6bc66-6f0a-1ef5-883a-3aa6bd050d44"
    borrow_date:
      type: string
      format: date
      description: Ngày bắt đầu mượn sách
      example: "2026-10-01"
    due_date:
      type: string
      format: date
      description: Hạn chót phải trả sách
      example: "2026-10-15"
    return_date:
      type: string
      format: date
      nullable: true
      description: Ngày thực tế trả sách (null nếu chưa trả)
      example: null
    status:
      type: string
      enum: [pending, borrowed, returned, overdue]
      description: Trạng thái phiếu mượn (đang chờ duyệt, đang mượn, đã trả, quá hạn)
      example: "borrowed"
    renew_count:
      type: integer
      minimum: 0
      description: Số lần đã gia hạn mượn
      example: 0
    note:
      type: string
      description: Ghi chú tình trạng sách hoặc thông tin mượn
      example: "Sách mới, bìa nguyên vẹn"
    fine_amount:
      type: number
      format: float
      minimum: 0
      description: Tiền phạt nếu trả muộn hoặc làm hư hại sách (VNĐ)
      example: 0.0
    created_at:
      type: string
      format: date-time
      description: Thời điểm tạo bản ghi
      example: "2026-10-01T08:30:00Z"
    updated_at:
      type: string
      format: date-time
      description: Thời điểm cập nhật lần cuối
      example: "2026-10-01T08:30:00Z"

# Schema yêu cầu tạo phiếu mượn mới (POST /borrow)
BorrowCreateRequest:
  type: object
  required:
    - book_id
    - user_id
  properties:
    book_id:
      type: string
      format: uuid
      description: ID của cuốn sách muốn mượn
      example: "a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11"
    user_id:
      type: string
      format: uuid
      description: ID của người mượn sách
      example: "d3b6bc66-6f0a-1ef5-883a-3aa6bd050d44"
    due_date:
      type: string
      format: date
      description: Ngày dự kiến trả (nếu không điền sẽ mặc định theo quy định thư viện, ví dụ +14 ngày)
      example: "2026-10-25"
    note:
      type: string
      description: Ghi chú ban đầu
      example: "Mượn phục vụ nghiên cứu luận văn"

# Schema cập nhật phiếu mượn / Trả sách / Gia hạn (PUT /borrow/{id})
BorrowUpdateRequest:
  type: object
  properties:
    status:
      type: string
      enum: [borrowed, returned, overdue]
      description: Cập nhật trạng thái phiếu mượn
      example: "returned"
    return_date:
      type: string
      format: date
      description: Ngày thực tế trả sách (bắt buộc khi status = returned)
      example: "2026-10-14"
    due_date:
      type: string
      format: date
      description: Gia hạn ngày hẹn trả
      example: "2026-10-30"
    note:
      type: string
      description: Ghi chú khi trả hoặc gia hạn (tình trạng sách lúc trả)
      example: "Đã trả đủ sách, gáy sách hơi sờn"
    fine_amount:
      type: number
      format: float
      minimum: 0
      description: Tiền phạt thu thêm (nếu có)
      example: 10000.0

# Schema danh sách phiếu mượn trả về (GET /borrow)
BorrowListResponse:
  type: object
  required:
    - data
    - pagination
  properties:
    data:
      type: array
      items:
        $ref: '#/BorrowRecord'
    pagination:
      $ref: '#/PaginationMeta'
# ==========================================
# 3. AUTH SCHEMAS (Xác thực người dùng)
# ==========================================
LoginRequest:
  type: object
  required:
    - username
    - password
  properties:
    username:
      type: string
      example: "admin"
    password:
      type: string
      format: password
      example: "password123"

LoginResponse:
  type: object
  properties:
    access_token:
      type: string
      description: Chuỗi JWT token để xác thực các request sau
      example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM..."
    token_type:
      type: string
      example: "Bearer"
    expires_in:
      type: integer
      description: Thời gian sống của token (tính bằng giây)
      example: 3600

RegisterRequest:
  type: object
  required:
    - username
    - password
    - email
    - full_name
  properties:
    username:
      type: string
      example: "nguyenvana"
    password:
      type: string
      format: password
      example: "matkhau123"
    email:
      type: string
      format: email
      example: "nva@example.com"
    full_name:
      type: string
      example: "Nguyễn Văn A"

User:
  type: object
  properties:
    id:
      type: string
      format: uuid
      example: "e6f4a8b2-1b1c-4b1a-9f5b-1c5b8b9b8b9b"
    username:
      type: string
      example: "nguyenvana"
    email:
      type: string
      format: email
      example: "nva@example.com"
    full_name:
      type: string
      example: "Nguyễn Văn A"
    role:
      type: string
      enum: [admin, user, librarian]
      example: "user"
