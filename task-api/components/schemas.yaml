ErrorDetail:
  type: object
  description: Chi tiết lỗi phát sinh theo từng trường dữ liệu
  required:
    - field
    - issue
  properties:
    field:
      type: string
      description: Tên trường bị lỗi
      example: "published_year"
    issue:
      type: string
      description: Chi tiết lỗi phát sinh
      example: "Năm xuất bản không được lớn hơn năm hiện tại"

ErrorResponse:
  type: object
  description: Cấu trúc phản hồi lỗi chuẩn
  required:
    - code
    - message
    - timestamp
  properties:
    code:
      type: integer
      description: Mã trạng thái HTTP hoặc Mã lỗi nội bộ
      example: 400
    message:
      type: string
      description: Thông điệp giải thích lỗi
      example: "Dữ liệu yêu cầu không hợp lệ"
    timestamp:
      type: string
      format: date-time
      description: Thời điểm phát sinh lỗi
      example: "2026-10-08T19:40:00Z"
    details:
      type: array
      description: Danh sách chi tiết lỗi theo từng trường dữ liệu (nếu có)
      items:
        $ref: "#/ErrorDetail"

PaginationMeta:
  type: object
  required:
    - page
    - limit
    - total_items
    - total_pages
  properties:
    page:
      type: integer
      minimum: 1
      description: Trang hiện tại
      example: 1
    limit:
      type: integer
      minimum: 1
      maximum: 100
      description: Số phần tử tối đa trên mỗi trang
      example: 10
    total_items:
      type: integer
      minimum: 0
      description: Tổng số phần tử trong tập dữ liệu
      example: 150
    total_pages:
      type: integer
      minimum: 0
      description: Tổng số trang (total_items / limit)
      example: 15

Book:
  type: object
  description: >
    Thực thể đại diện cho một cuốn sách trong hệ thống thư viện.
    Chứa đầy đủ thông tin mô tả, phân loại, số lượng và trạng thái sẵn có.
  required:
    - id
    - title
    - author_id
    - category_id
    - category
    - quantity
  properties:
    id:
      type: string
      format: uuid
      description: Mã định danh duy nhất của cuốn sách (UUID v4)
      example: "a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11"
    title:
      type: string
      maxLength: 255
      description: Tiêu đề cuốn sách
      example: "Thiết Kế Kiến Trúc Microservices"
    description:
      type: string
      maxLength: 2000
      description: Mô tả ngắn gọn nội dung cuốn sách
      example: "Cuốn sách hướng dẫn toàn diện về thiết kế và triển khai kiến trúc Microservices trong các hệ thống phân tán hiện đại."
    isbn:
      type: string
      pattern: '^\d{3}-\d{1,5}-\d{1,7}-\d{1,7}-\d{1}$'
      description: Mã ISBN (International Standard Book Number) theo chuẩn ISBN-13
      example: "978-3-16-148410-0"
    author_id:
      type: string
      format: uuid
      description: Mã định danh của tác giả (liên kết đến Author)
      example: "b1f8bc88-8d0a-3ef7-aa5c-5aa8bd270f22"
    category_id:
      type: string
      format: uuid
      description: Mã định danh của danh mục/thể loại sách (dùng để lọc)
      example: "f4c7bc55-5d0a-0ef4-772a-2ff5bd940c11"
    category:
      type: string
      description: Tên danh mục/thể loại sách (hiển thị)
      example: "Công nghệ thông tin"
    published_year:
      type: integer
      minimum: 1000
      maximum: 2100
      description: Năm xuất bản
      example: 2025
    quantity:
      type: integer
      minimum: 0
      description: Tổng số lượng sách trong thư viện
      example: 20
    available_quantity:
      type: integer
      minimum: 0
      description: Số lượng sách hiện có sẵn để mượn
      example: 15
    created_at:
      type: string
      format: date-time
      description: Thời điểm bản ghi được tạo
      example: "2026-01-15T08:30:00Z"
    updated_at:
      type: string
      format: date-time
      description: Thời điểm bản ghi được cập nhật lần cuối
      example: "2026-06-20T14:00:00Z"

BookListResponse:
  type: object
  description: Phản hồi danh sách sách kèm thông tin phân trang
  required:
    - data
    - pagination
  properties:
    data:
      type: array
      description: Danh sách các cuốn sách phù hợp với điều kiện truy vấn
      items:
        $ref: "#/Book"
    pagination:
      $ref: "#/PaginationMeta"

BookDetailResponse:
  type: object
  description: Phản hồi chi tiết một cuốn sách
  required:
    - data
  properties:
    data:
      $ref: "#/Book"

BookCreateInput:
  type: object
  description: Thông tin yêu cầu khi thêm mới một cuốn sách vào thư viện
  required:
    - title
    - author_id
    - category_id
    - category
    - quantity
  properties:
    title:
      type: string
      maxLength: 255
      description: Tiêu đề cuốn sách
      example: "Thiết Kế Kiến Trúc Microservices"
    description:
      type: string
      maxLength: 2000
      description: Mô tả nội dung cuốn sách
      example: "Cuốn sách hướng dẫn toàn diện về thiết kế và triển khai kiến trúc Microservices trong các hệ thống phân tán hiện đại."
    isbn:
      type: string
      pattern: '^\d{3}-\d{1,5}-\d{1,7}-\d{1,7}-\d{1}$'
      description: Mã ISBN-13
      example: "978-3-16-148410-0"
    author_id:
      type: string
      format: uuid
      description: ID tác giả viết cuốn sách
      example: "b1f8bc88-8d0a-3ef7-aa5c-5aa8bd270f22"
    category_id:
      type: string
      format: uuid
      description: ID thể loại/danh mục sách
      example: "f4c7bc55-5d0a-0ef4-772a-2ff5bd940c11"
    category:
      type: string
      description: Tên thể loại/danh mục sách
      example: "Công nghệ thông tin"
    published_year:
      type: integer
      minimum: 1000
      maximum: 2100
      description: Năm xuất bản
      example: 2025
    quantity:
      type: integer
      minimum: 1
      description: Tổng số lượng sách nhập kho
      example: 20

BookUpdateInput:
  type: object
  description: Thông tin cập nhật cho một cuốn sách (các trường không bắt buộc)
  properties:
    title:
      type: string
      maxLength: 255
      description: Tiêu đề cuốn sách
      example: "Thiết Kế Kiến Trúc Microservices (Tái bản 2026)"
    description:
      type: string
      maxLength: 2000
      description: Mô tả nội dung cuốn sách
      example: "Cập nhật các mô hình kiến trúc hướng dịch vụ tiên tiến."
    isbn:
      type: string
      pattern: '^\d{3}-\d{1,5}-\d{1,7}-\d{1,7}-\d{1}$'
      example: "978-3-16-148410-0"
    author_id:
      type: string
      format: uuid
      example: "b1f8bc88-8d0a-3ef7-aa5c-5aa8bd270f22"
    category_id:
      type: string
      format: uuid
      example: "f4c7bc55-5d0a-0ef4-772a-2ff5bd940c11"
    category:
      type: string
      example: "Công nghệ thông tin"
    published_year:
      type: integer
      minimum: 1000
      maximum: 2100
      example: 2026
    quantity:
      type: integer
      minimum: 0
      example: 25
    available_quantity:
      type: integer
      minimum: 0
      example: 20

Author:
  type: object
  required:
    - id
    - name
  properties:
    id:
      type: string
      format: uuid
      example: "b1f8bc88-8d0a-3ef7-aa5c-5aa8bd270f22"
    name:
      type: string
      maxLength: 100
      example: "Nguyen Van A"
    email:
      type: string
      format: email
      example: "nguyenvana@example.com"
    bio:
      type: string
      example: "Chuyên gia với 10 năm kinh nghiệm thiết kế hệ thống phân tán."
    created_at:
      type: string
      format: date-time
      example: "2025-11-20T10:00:00Z"

AuthorRequest:
  type: object
  description: Dữ liệu gửi lên khi tạo mới hoặc cập nhật thông tin tác giả
  required:
