# Author Module Schemas

Author:
  type: object
  required:
    - id
    - name
  properties:
    id:
      type: string
      format: uuid
      example: "b1f8bc88-8d0a-3ef7-aa5c-5aa8bd270f22"
    name:
      type: string
      maxLength: 100
      example: "Nguyen Van A"
    email:
      type: string
      format: email
      example: "nguyenvana@example.com"
    bio:
      type: string
      example: "Chuyên gia với 10 năm kinh nghiệm thiết kế hệ thống phân tán."
    created_at:
      type: string
      format: date-time
      example: "2025-11-20T10:00:00Z"

AuthorRequest:
  type: object
  description: Dữ liệu gửi lên khi tạo mới hoặc cập nhật thông tin tác giả
  required:
    - name
  properties:
    name:
      type: string
      maxLength: 100
      description: Họ và tên của tác giả
      example: "Doãn Duy Lợi"
    email:
      type: string
      format: email
      description: Email liên hệ của tác giả
      example: "24021549@vnu.edu.vn"
    bio:
      type: string
      description: Tiểu sử ngắn gọn của tác giả
      example: "Nhà văn nổi tiếng."
    birth_date:
      type: string
      format: date
      description: Ngày sinh của tác giả
      example: "2006-11-22"

AuthorResponse:
  type: object
  description: Thông tin chi tiết của một tác giả
  required:
    - id
    - name
  properties:
    id:
      type: string
      format: uuid
      description: Mã định danh duy nhất của tác giả (UUID v4)
      example: "b1f8bc88-8d0a-3ef7-aa5c-5aa8bd270f22"
    name:
      type: string
      maxLength: 100
      description: Họ và tên của tác giả
      example: "Doãn Duy Lợi"
    email:
      type: string
      format: email
      description: Email của tác giả
      example: "24021549@vnu.edu.vn"
    bio:
      type: string
      description: Tiểu sử của tác giả
      example: "Nhà văn nổi tiếng."
    birth_date:
      type: string
      format: date
      description: Ngày sinh của tác giả
      example: "2006-11-22"
    created_at:
      type: string
      format: date-time
      description: Thời điểm tạo bản ghi
      example: "2025-11-20T10:00:00Z"
    updated_at:
      type: string
      format: date-time
      description: Thời điểm cập nhật lần cuối
      example: "2026-06-20T14:00:00Z"

AuthorListResponse:
  type: object
  description: Phản hồi danh sách tác giả kèm thông tin phân trang
  required:
    - data
    - pagination
  properties:
    data:
      type: array
      description: Danh sách tác giả phù hợp điều kiện truy vấn
      items:
        $ref: "#/AuthorResponse"
    pagination:
      $ref: "./common.yaml#/PaginationMeta"
