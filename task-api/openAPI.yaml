openapi: 3.0.3
info:
  title: Book Management RESTful API
  description: >
    Hệ thống API quản lý thư viện sách tập trung. 
    Hỗ trợ các chức năng quản lý danh mục sách, thông tin tác giả và quy trình mượn/trả sách.
  version: 1.0.0
  termsOfService: https://example.com/terms/
  contact:
    name: Doãn Duy Lợi
    email: 24021549@vnu.edu.vn
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080/v1
    description: Local Development Environment
  - url: https://api.library-demo.com/v1
    description: Staging Environment

tags:
  - name: Books
    description: Quản lý thông tin, tìm kiếm và cập nhật dữ liệu sách
  - name: Authors
    description: Quản lý hồ sơ, tiểu sử và tác phẩm của tác giả
  - name: Borrows
    description: Quy trình lập phiếu mượn, gia hạn và trả sách
  - name: Auth
    description: Xác thực người dùng và cấp phát JWT Token

paths:
  /auth/login:
    $ref: "./paths/auth.yaml#/login"
  /auth/register:
    $ref: "./paths/auth.yaml#/register"
  /auth/me:
    $ref: "./paths/auth.yaml#/me"
  /books:
    $ref: "./paths/books.yaml#/books"
  /books/{id}:
    $ref: "./paths/books.yaml#/book_by_id"

  /authors:
    $ref: "./paths/authors.yaml#/authors"
  /authors/{id}:
    $ref: "./paths/authors.yaml#/author_by_id"

  /borrows:
    $ref: "./paths/borrows.yaml#/borrows"
  /borrows/{id}:
    $ref: "./paths/borrows.yaml#/borrow_by_id"

components:
  schemas:
    # 1. Error & Common Schemas
    ErrorDetail:
      $ref: "./components/schemas/common.yaml#/ErrorDetail"
    ErrorResponse:
      $ref: "./components/schemas/common.yaml#/ErrorResponse"
    PaginationMeta:
      $ref: "./components/schemas/common.yaml#/PaginationMeta"

    # 2. Books Module Schemas
    Book:
      $ref: "./components/schemas/books.yaml#/Book"
    BookListResponse:
      $ref: "./components/schemas/books.yaml#/BookListResponse"
    BookDetailResponse:
      $ref: "./components/schemas/books.yaml#/BookDetailResponse"
    BookCreateInput:
      $ref: "./components/schemas/books.yaml#/BookCreateInput"
    BookUpdateInput:
      $ref: "./components/schemas/books.yaml#/BookUpdateInput"

    # 3. Authors Module Schemas
    Author:
      $ref: "./components/schemas/authors.yaml#/Author"
    AuthorRequest:
      $ref: "./components/schemas/authors.yaml#/AuthorRequest"
    AuthorResponse:
      $ref: "./components/schemas/authors.yaml#/AuthorResponse"
    AuthorListResponse:
      $ref: "./components/schemas/authors.yaml#/AuthorListResponse"

    # 4. Borrows Module Schemas
    BorrowRecord:
      $ref: "./components/schemas/borrows.yaml#/BorrowRecord"
    BorrowCreateRequest:
      $ref: "./components/schemas/borrows.yaml#/BorrowCreateRequest"
    BorrowUpdateRequest:
      $ref: "./components/schemas/borrows.yaml#/BorrowUpdateRequest"
    BorrowListResponse:
      $ref: "./components/schemas/borrows.yaml#/BorrowListResponse"

    # 5. Auth & User Module Schemas
    LoginRequest:
      $ref: "./components/schemas/auth.yaml#/LoginRequest"
    LoginResponse:
      $ref: "./components/schemas/auth.yaml#/LoginResponse"
    RegisterRequest:
      $ref: "./components/schemas/auth.yaml#/RegisterRequest"
    User:
      $ref: "./components/schemas/auth.yaml#/User"

  responses:
    BadRequest:
      $ref: "./components/responses.yaml#/BadRequest"
    Unauthorized:
      $ref: "./components/responses.yaml#/Unauthorized"
    Forbidden:
      $ref: "./components/responses.yaml#/Forbidden"
    NotFound:
      $ref: "./components/responses.yaml#/NotFound"
    Conflict:
      $ref: "./components/responses.yaml#/Conflict"
    UnprocessableEntity:
      $ref: "./components/responses.yaml#/UnprocessableEntity"
    InternalServerError:
      $ref: "./components/responses.yaml#/InternalServerError"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Nhập token xác thực định dạng JWT"

security:
  - BearerAuth: []
