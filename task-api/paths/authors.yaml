# 1. Các thao tác trên danh sách / tập hợp tài nguyên (/authors)
/authors:
  get:
    tags:
      - Authors
    summary: Lấy danh sách tác giả
    description: Trả về danh sách tác giả có hỗ trợ phân trang (pagination) và tìm kiếm theo tên.
    parameters:
      - name: page
        in: query
        description: Số thứ tự trang hiện tại
        required: false
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: limit
        in: query
        description: Số lượng bản ghi mỗi trang
        required: false
        schema:
          type: integer
          default: 10
          maximum: 100
      - name: search
        in: query
        description: Tìm kiếm tác giả theo tên
        required: false
        schema:
          type: string
    responses:
      '200':
        description: Lấy danh sách thành công
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components/schemas.yaml#/AuthorResponse'
      '500':
        description: Lỗi máy chủ nội bộ

  post:
    tags:
      - Authors
    summary: Tạo tác giả mới
    description: Thêm một tác giả mới vào hệ thống. Yêu cầu quyền quản trị viên.
    security:
      - BearerAuth: []
    requestBody:
      required: true
      description: Thông tin tác giả cần tạo
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/AuthorRequest'
    responses:
      '201':
        description: Tạo tác giả thành công
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/AuthorResponse'
      '400':
        description: Dữ liệu gửi lên không hợp lệ (Bad Request)
      '401':
        description: Chưa xác thực (Unauthorized)

# 2. Các thao tác trên từng tài nguyên cụ thể (/authors/{id})
/authors/{id}:
  parameters:
    - name: id
      in: path
      required: true
      description: UUID của tác giả
      schema:
        type: string
        format: uuid
        example: "b1f8bc88-8d0a-3ef7-aa5c-5aa8bd270f22"

  get:
    tags:
      - Authors
    summary: Lấy thông tin chi tiết một tác giả
    responses:
      '200':
        description: Tìm thấy tác giả
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/AuthorResponse'
      '404':
        description: Không tìm thấy tác giả với ID tương ứng

  put:
    tags:
      - Authors
    summary: Cập nhật thông tin tác giả
    security:
      - BearerAuth: []
    requestBody:
      required: true
      description: Thông tin cập nhật của tác giả
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/AuthorRequest'
    responses:
      '200':
        description: Cập nhật thành công
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/AuthorResponse'
      '400':
        description: Dữ liệu không hợp lệ
      '404':
        description: Không tìm thấy tác giả

  delete:
    tags:
      - Authors
    summary: Xóa tác giả
    security:
      - BearerAuth: []
    responses:
      '204':
        description: Xóa thành công, không có nội dung trả về
      '404':
        description: Không tìm thấy tác giả